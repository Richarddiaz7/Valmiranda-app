<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function pedir(item) {
        // Mostramos una alerta rápida en Telegram
        tg.showAlert("Has seleccionado: " + item);
        
        // Enviamos el dato al bot
        tg.sendData("PEDIDO: " + item);
        
        // Cerramos la App para que el usuario vuelva al chat
        setTimeout(() => {
            tg.close();
        }, 500);
    }
</script>
