<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodega Valmiranda</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); margin: 0; padding: 20px; text-align: center; }
        .card { background: var(--tg-theme-secondary-bg-color); border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        h1 { color: #f39c12; }
        button { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🍏 Bodega Valmiranda</h1>
    <p>Selecciona tus productos:</p>

    <div class="card">
        <span>Papa (1kg) - 40bs</span>
        <button onclick="pedir('Papa')">Añadir</button>
    </div>
    <div class="card">
        <span>Cebolla (1kg) - 50bs</span>
        <button onclick="pedir('Cebolla')">Añadir</button>
    </div>
    <div class="card">
        <span>Tomate (1kg) - 60bs</span>
        <button onclick="pedir('Tomate')">Añadir</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.setText("VER PEDIDO");
        tg.MainButton.show();

        function pedir(item) {
            tg.sendData("Pedido: " + item);
            tg.close();
        }
    </script>
</body>
</html>
