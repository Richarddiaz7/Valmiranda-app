<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valmiranda App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); margin: 0; padding: 20px; text-align: center; }
        .card { background: var(--tg-theme-secondary-bg-color); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; cursor: pointer; }
        button { background: #2ecc71; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body>
    <h1>🍏 Bodega Valmiranda</h1>
    <p>Seleccione un producto:</p>

    <div class="card" onclick="enviar('Papa')"><span>Papa</span><button>Pedir</button></div>
    <div class="card" onclick="enviar('Cebolla')"><span>Cebolla</span><button>Pedir</button></div>
    <div class="card" onclick="enviar('Tomate')"><span>Tomate</span><button>Pedir</button></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function enviar(producto) {
            // Envía el dato seleccionado al chat y cierra la app
            tg.sendData(producto);
            tg.close();
        }
    </script>
</body>
</html>
