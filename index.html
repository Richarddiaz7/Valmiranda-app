<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valmiranda Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --p-color: #27ae60; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .header { background: var(--p-color); color: white; padding: 15px; text-align: center; font-weight: bold; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-btn { width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 12px; font-weight: bold; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">VALMIRANDA C.A.</div>

    <div id="page-home" class="page active">
        <div class="stats">
            <div class="stat-card"><span>Ventas</span><h2 id="v-hoy">0$</h2></div>
            <div class="stat-card"><span>Ganancia</span><h2 id="g-neta">0$</h2></div>
        </div>
        <button class="nav-btn" style="background:#27ae60" onclick="showPage('page-sales')">🛒 NUEVA VENTA</button>
        <button class="nav-btn" style="background:#2c3e50" onclick="showPage('page-inv')">📦 INVENTARIO</button>
    </div>

    <div id="page-sales" class="page">
        <h3>🛒 Productos</h3>
        <button onclick="enviar('PAPA')">🥔 PAPA</button>
        <button onclick="showPage('page-home')" style="margin-top:20px">⬅ VOLVER</button>
    </div>

    <div id="page-inv" class="page">
        <h3>📦 Stock</h3>
        <p>Pronto cargaremos la lista aquí...</p>
        <button onclick="showPage('page-home')">⬅ VOLVER</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        document.getElementById('v-hoy').innerText = (params.get('v') || '0') + "$";
        document.getElementById('g-neta').innerText = (params.get('g') || '0') + "$";

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function enviar(item) {
            tg.sendData(item);
            tg.close();
        }
    </script>
</body>
</html>
