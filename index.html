          <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodega Valmiranda</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); margin: 0; padding: 20px; text-align: center; }
        .card { background: var(--tg-theme-secondary-bg-color); border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        button { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .selected { border: 2px solid #2ecc71; background: #e8f8f0; }
    </style>
</head>
<body>
    <h1>🍏 Bodega Valmiranda</h1>
    <p>Toca un producto y luego confirma abajo:</p>

    <div class="card" id="Papa" onclick="seleccionar('Papa')"><span>Papa (1kg)</span><button>Elegir</button></div>
    <div class="card" id="Cebolla" onclick="seleccionar('Cebolla')"><span>Cebolla (1kg)</span><button>Elegir</button></div>
    <div class="card" id="Tomate" onclick="seleccionar('Tomate')"><span>Tomate (1kg)</span><button>Elegir</button></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let productoSeleccionado = "";

        function seleccionar(item) {
            productoSeleccionado = item;
            // Configuramos el botón principal de Telegram
            tg.MainButton.text = "CONFIRMAR PEDIDO: " + item;
            tg.MainButton.show();
        }

        // Cuando el usuario pulse el botón grande de abajo
        tg.onEvent('mainButtonClicked', function(){
            tg.sendData(productoSeleccionado);
            tg.close();
        });
    </script>
</body>
</html>
