<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valmiranda Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --p-color: #27ae60; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; color: #2c3e50; }
        .header { background: var(--p-color); color: white; padding: 15px; text-align: center; font-weight: bold; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nav-btn { width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 12px; font-weight: bold; color: white; cursor: pointer; font-size: 16px; }
        .item-row { background: white; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="header">BODEGA VALMIRANDA C.A.</div>

    <div id="page-home" class="page active">
        <div class="stats">
            <div class="stat-card"><span>Ventas Hoy</span><h2 id="v-hoy">0$</h2></div>
            <div class="stat-card"><span>Ganancia</span><h2 id="g-neta">0$</h2></div>
        </div>
        <button class="nav-btn" style="background:#2ecc71" onclick="showPage('page-sales')">🛒 NUEVA VENTA</button>
        <button class="nav-btn" style="background:#34495e" onclick="pedirInventario()">📦 VER INVENTARIO</button>
        <button class="nav-btn" style="background:#8e44ad" onclick="showPage('page-admin')">⚙️ ALMACÉN / GESTIÓN</button>
    </div>

    <div id="page-sales" class="page">
        <h3>🛒 Seleccione Producto</h3>
        <div class="item-row" onclick="enviar('VENTA:Papa')"><span>🥔 Papa</span> <span>➕</span></div>
        <div class="item-row" onclick="enviar('VENTA:Cebolla')"><span>🧅 Cebolla</span> <span>➕</span></div>
        <button class="nav-btn" style="background:#95a5a6; margin-top:20px;" onclick="showPage('page-home')">⬅ VOLVER</button>
    </div>

    <div id="page-admin" class="page">
        <h3>⚙️ Administración</h3>
        <button class="nav-btn" style="background:#27ae60" onclick="enviar('ADMIN:STOCK')">📦 CARGAR STOCK</button>
        <button class="nav-btn" style="background:#d35400" onclick="enviar('ADMIN:PRECIO')">💵 EDITAR PRECIOS</button>
        <button class="nav-btn" style="background:#95a5a6" onclick="showPage('page-home')">⬅ VOLVER</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        document.getElementById('v-hoy').innerText = (params.get('v') || '0.00') + "$";
        document.getElementById('g-neta').innerText = (params.get('g') || '0.00') + "$";

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function pedirInventario() {
            tg.sendData("PEDIR_INV");
            tg.close();
        }

        function enviar(data) {
            tg.sendData(data);
            tg.close();
        }
    </script>
</body>
</html>
